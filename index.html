<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>12-Zodiac Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23c7527b'/%3E%3Ctext x='50%' y='50%' dy='.35em' text-anchor='middle' font-family='Segoe UI Emoji' font-size='32'%3E8%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="light">
  <noscript>
    <div style="padding:1rem; background:#ffe4e1; color:#b22222; text-align:center;">This dashboard requires JavaScript to display zodiac cards. Please enable JavaScript.</div>
  </noscript>
  <div id="app">
    <header class="app-header">
      <div class="logo-area">
        <h1 id="appTitle">12 Zodiac Dashboard</h1>
        <p id="appSubtitle" class="subtitle">Explore the animals of the Chinese zodiac</p>
      </div>
      <div class="toggles">
        <div class="toggle-group" id="languageToggleGroup" aria-label="Language">
          <button class="lang-btn active" data-lang="en" type="button">EN</button>
          <button class="lang-btn" data-lang="zh" type="button">中文</button>
        </div>
        <div class="toggle-group" id="themeToggleGroup" aria-label="Theme">
          <span id="themeLabel" class="toggle-label">Light</span>
          <label class="switch">
            <input type="checkbox" id="themeToggle" />
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </header>

    <main>
      <section class="controls" aria-label="Filters and search">
        <div class="control search-control">
          <label for="searchInput" id="searchLabel">Search</label>
          <input id="searchInput" type="search" placeholder="Search zodiac..." />
        </div>
        <div class="control filter-control">
          <label for="elementFilter" id="elementLabel">Element</label>
          <select id="elementFilter">
            <!-- options injected -->
          </select>
        </div>
      </section>

      <section id="zodiacGrid" class="zodiac-grid" aria-live="polite">
        <!-- cards injected by script.js -->
      </section>
    </main>
  </div>

  <div id="detailOverlay" class="detail-overlay hidden" aria-hidden="true">
    <div class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <button class="close-btn" id="detailClose" aria-label="Close">&times;</button>
      <div class="detail-content animation-glow">
        <div class="detail-header">
          <div class="detail-icon" id="detailIcon"></div>
          <div>
            <h2 id="detailTitle"></h2>
            <h3 id="detailTitleAlt" class="detail-alt"></h3>
          </div>
        </div>
        <p class="detail-element"><strong id="detailElementLabel">Element:</strong> <span id="detailElementValue"></span></p>
        <p class="detail-trait"><strong id="detailTraitLabel">Key Trait:</strong> <span id="detailTraitValue"></span></p>
        <p class="detail-description" id="detailDescription"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
