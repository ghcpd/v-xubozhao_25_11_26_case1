<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>12-Zodiac Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1 id="title">12-Zodiac Dashboard</h1>
      </div>
      <div class="controls">
        <div class="control search"><label for="search">Search</label>
          <input id="search" type="text" placeholder="Search by name or trait" aria-label="Search" />
        </div>
        <div class="control"><label for="elementFilter">Element</label>
          <select id="elementFilter" aria-label="Filter by element"></select>
        </div>
        <div class="control toggles">
          <label class="toggle" title="Toggle language">
            <input id="langToggle" type="checkbox" aria-label="Toggle language" />
            <span class="toggle-label">中文</span>
          </label>
          <label class="toggle">
            <input id="themeToggle" type="checkbox" aria-label="Toggle theme" />
            <span class="toggle-label">Dark</span>
          </label>
        </div>
      </div>
    </header>

    <main>
      <section id="grid" class="grid"></section>
    </main>

    <!-- Detail Slide-in Panel -->
    <aside id="detailPanel" class="detail-panel" aria-hidden="true">
      <button id="closeDetail" class="close-btn">×</button>
      <div class="detail-content">
        <div id="detailEmoji" class="detail-emoji"></div>
        <h2 id="detailName"></h2>
        <h3 id="detailNameZh"></h3>
        <div class="meta"><span id="detailElement"></span></div>
        <p id="detailDesc"></p>
      </div>
    </aside>

    <div id="overlay" class="overlay hidden"></div>

    <script src="script.js"></script>
  </body>
</html>
